<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Редагування статті</title>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<header th:insert="blocks/header :: header"></header>
<div class="container mt-5 mb-5">
    <h1>Редагування статті</h1>
    <div th:if="${post != null}">
        <form th:action="'/blog/' + ${post.id} + '/edit'" method="post">
            <div class="mb-3">
                <input type="text" th:value="${post.title}" name="title"
                       placeholder="Назва статті" class="form-control"/>
            </div>
            <div class="mb-3">
                <input type="text" th:value="${post.anons}" name="anons"
                       placeholder="Анонс статті" class="form-control"/>
            </div>
            <div class="mb-3">
                <textarea name="content" placeholder="Повний текст"
                          class="form-control" th:text="${post.content}"/>
            </div>
            <button type="submit" class="btn btn-success">Оновити</button>
            <a href="/blog" class="btn btn-secondary ms-2">Назад</a>
        </form>
    </div>
</div>
<div th:insert="blocks/footer :: footer"></div>
</body>
</html>
