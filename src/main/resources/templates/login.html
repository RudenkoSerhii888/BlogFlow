<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Вхід</title>
  <meta charset="UTF-8"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<header th:insert="blocks/header :: header"></header>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <h2 class="mb-4">Вхід</h2>
      <form action="/j_spring_security_check" method="post">
        <div class="mb-3">
          <label class="form-label">Логін</label>
          <input type="text" name="j_login" class="form-control"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <input type="password" name="j_password" class="form-control"/>
        </div>
        <button type="submit" class="btn btn-primary w-100">Увійти</button>
        <p class="mt-3 text-center">
          <a href="/register">Зареєструватись</a>
        </p>
        <div th:if="${param.error}" class="alert alert-danger mt-3">
          Невірний логін або пароль!
        </div>
        <div th:if="${param.logout}" class="alert alert-success mt-3">
          Ви вийшли з системи!
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
