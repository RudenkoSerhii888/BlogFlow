<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Реєстрація</title>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<header th:insert="blocks/header :: header"></header>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2 class="mb-4">Реєстрація</h2>
            <form action="/newuser" method="post">
                <div class="mb-3">
                    <label class="form-label">Логін</label>
                    <input type="text" name="login" th:value="${login}" class="form-control"/>
                    <div th:if="${loginError}" class="text-danger" th:text="${loginError}"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control"/>
                    <div th:if="${passwordError}" class="text-danger" th:text="${passwordError}"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="text" name="email" class="form-control"/>
                    <div th:if="${emailError}" class="text-danger" th:text="${emailError}"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Телефон</label>
                    <input type="text" name="phone" class="form-control"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Адреса</label>
                    <input type="text" name="address" class="form-control"/>
                </div>
                <button type="submit" class="btn btn-success w-100">Зареєструватись</button>
                <div th:if="${exists}" class="alert alert-danger mt-3">
                    Користувач вже існує!
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
