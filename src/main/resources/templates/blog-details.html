<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>BlogFlow</title>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<header th:insert="blocks/header :: header"></header>
<div class="container mt-5">
    <div th:if="${post != null}">
        <h1 th:text="${post.title}"/>
        <p th:text="${post.content}"/>
        <p><b>Перегляди:</b> <span th:text="${post.views}"/></p>
        <p><b>Автор:</b>
            <span th:text="${post.author != null ? post.author.login : 'невідомо'}"/>
        </p>
        <small class="text-muted"
               th:text="${#temporals.format(post.createdAt, 'dd.MM.yyyy HH:mm')}"/>

        <div th:if="${currentUser != null and post.author != null and post.author.id == currentUser.id}" class="mt-3">
            <a th:href="'/blog/' + ${post.id} + '/edit'"
               class="btn btn-warning">Редагувати</a>
            <form th:action="'/blog/' + ${post.id} + '/remove'"
                  method="post" class="d-inline ms-2">
                <button type="submit" class="btn btn-danger"
                        onclick="return confirm('Видалити статтю?')">Видалити</button>
            </form>
        </div>

        <div sec:authorize="hasRole('ROLE_ADMIN')" class="mt-2">
            <a th:href="'/blog/' + ${post.id} + '/edit'"
               class="btn btn-warning">Редагувати (адмін)</a>
            <form th:action="'/blog/' + ${post.id} + '/remove'"
                  method="post" class="d-inline">
                <button type="submit" class="btn btn-danger">Видалити</button>
            </form>
        </div>

        <!-- Секція коментарів -->
        <hr class="mt-4"/>
        <h4>Коментарі (<span th:text="${#lists.size(comments)}"/>)</h4>

        <!-- Форма додавання коментаря -->
        <div sec:authorize="isAuthenticated()" class="mt-3">
            <form th:action="'/blog/' + ${post.id} + '/comment'" method="post">
                <div class="mb-2">
                    <textarea name="content" class="form-control"
                              rows="3" placeholder="Напишіть коментар..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Додати коментар</button>
            </form>
        </div>

        <div sec:authorize="isAnonymous()" class="mt-3">
            <p class="text-muted">
                <a href="/login">Увійдіть</a> щоб залишити коментар.
            </p>
        </div>

        <!-- Список коментарів -->
        <div th:each="comment : ${comments}" class="card mt-3 p-3">
            <div class="d-flex justify-content-between">
                <div>
                    <b th:text="${comment.author != null ?
                                  comment.author.login : 'невідомо'}"/>
                    <small class="text-muted ms-2"
                           th:text="${#temporals.format(comment.createdAt,
                                     'dd.MM.yyyy HH:mm')}"/>
                </div>

                <!-- Видалення коментаря -->
                <form th:if="${currentUser != null and
                               (comment.author.id == currentUser.id)}"
                      th:action="'/blog/' + ${post.id} +
                                 '/comment/' + ${comment.id} + '/delete'"
                      method="post">
                    <button type="submit"
                            class="btn btn-danger btn-sm">Видалити</button>
                </form>

                <form sec:authorize="hasRole('ROLE_ADMIN')"
                      th:action="'/blog/' + ${post.id} +
                                 '/comment/' + ${comment.id} + '/delete'"
                      method="post">
                    <button type="submit"
                            class="btn btn-danger btn-sm">Видалити (адмін)</button>
                </form>
            </div>
            <p class="mt-2" th:text="${comment.content}"/>
        </div>

    </div>
</div>
<div th:insert="blocks/footer :: footer"></div>
</body>
</html>
