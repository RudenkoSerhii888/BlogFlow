<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Профіль</title>
  <meta charset="UTF-8"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<header th:insert="blocks/header :: header"></header>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h2 class="mb-4">Профіль: <span th:text="${login}"/></h2>
      <p>Роль:
        <span th:each="r : ${roles}" th:text="${r}" class="badge bg-secondary me-1"/>
      </p>
      <form action="/update" method="post">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="text" name="email" th:value="${email}" class="form-control"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Телефон</label>
          <input type="text" name="phone" th:value="${phone}" class="form-control"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Адреса</label>
          <input type="text" name="address" th:value="${address}" class="form-control"/>
        </div>
        <button type="submit" class="btn btn-primary w-100">Оновити</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
