<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>BlogFlow</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<header th:insert="blocks/header :: header"></header>

<div class="container mt-5 mb-5">
    <h1>Додавання статті</h1>
    <form action="/blog/add" method="post">
        <div class="mb-3">
            <input type="text" name="title" placeholder="Введіть назву статті" class="form-control"/>
            <div th:if="${titleError}" class="text-danger" th:text="${titleError}"/>
        </div>
        <div class="mb-3">
            <input type="text" name="anons" placeholder="Введіть анонс статті" class="form-control"/>
            <div th:if="${anonError}" class="text-danger" th:text="${anonError}"/>
        </div>
        <div class="mb-3">
            <textarea name="content" placeholder="Введіть повний текст статті" class="form-control"></textarea>
            <div th:if="${contentError}" class="text-danger" th:text="${contentError}"/>
        </div>
        <button type="submit" class="btn btn-success">Додати статтю</button>
    </form>

</div>

<div th:insert="blocks/footer :: footer"></div>
</body>
</html>
