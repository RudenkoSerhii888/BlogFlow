<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>BlogFlow</title>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<header th:insert="blocks/header :: header"></header>
<div class="container mt-5">
    <h1>BlogFlow</h1>

    <div th:each="el : ${posts}" class="card mt-3 p-3">
        <h3 th:text="${el.title}"/>
        <p th:text="${el.anons}"/>
        <small class="text-muted" th:text="${#temporals.format(el.createdAt, 'dd.MM.yyyy HH:mm')}"/>
        <small class="text-muted ms-3">
            👁 <span th:text="${el.views}"/> переглядів
        </small>
        <a th:href="'/blog/' + ${el.id}" class="btn btn-warning mt-2">Детальніше</a>
    </div>

    <!-- Пагінація -->
    <nav class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="'/blog?page=' + ${currentPage - 1}">Назад</a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="'/blog?page=' + ${i}" th:text="${i + 1}"/>
            </li>

            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="'/blog?page=' + ${currentPage + 1}">Вперед</a>
            </li>
        </ul>
    </nav>
</div>
<div th:insert="blocks/footer :: footer"></div>
</body>
</html>
