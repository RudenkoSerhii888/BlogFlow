<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <title>Теми</title>
  <meta charset="UTF-8"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<header th:insert="blocks/header :: header"></header>
<div class="container mt-5">
  <h2>Теми для статей</h2>

  <form action="/topics/add" method="post" sec:authorize="hasRole('ROLE_ADMIN')" class="mb-3">
    <div class="input-group">
      <input type="text" name="title" class="form-control" placeholder="Нова тема"/>
      <button type="submit" class="btn btn-primary">Додати</button>
    </div>
  </form>

  <form action="/topics/removeAll" method="post" sec:authorize="hasRole('ROLE_ADMIN')" class="mb-3">
    <button type="submit" class="btn btn-danger">Видалити всі теми</button>
  </form>

  <form action="/topics/search" method="post" class="mb-3">
    <div class="input-group">
      <input type="text" name="searchTerm" th:value="${searchTerm}"
             class="form-control" placeholder="Пошук теми"/>
      <button type="submit" class="btn btn-outline-secondary">Знайти</button>
    </div>
  </form>

  <ul class="list-group">
    <li th:each="topic : ${topics}" class="list-group-item d-flex justify-content-between align-items-center">
      <span th:text="${topic.title}"/>
      <form th:action="'/topics/delete/' + ${topic.id}" method="post"
            sec:authorize="hasRole('ROLE_ADMIN')">
        <button type="submit" class="btn btn-danger btn-sm">Видалити</button>
      </form>
    </li>
  </ul>
</div>
</body>
</html>
