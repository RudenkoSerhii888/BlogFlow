<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Адмін панель</title>
  <meta charset="UTF-8"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<header th:insert="blocks/header :: header"></header>
<div class="container mt-5">
  <h2>Адмін панель — користувачі</h2>
  <form action="/delete" method="post" class="mt-3">
    <table class="table table-bordered">
      <thead>
      <tr>
        <th></th>
        <th>Логін</th>
        <th>Роль</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="user : ${users}">
        <td><input type="checkbox" name="toDelete[]" th:value="${user.id}"/></td>
        <td th:text="${user.login}"/>
        <td th:text="${user.role}"/>
      </tr>
      </tbody>
    </table>
    <button type="submit" class="btn btn-danger">Видалити вибраних</button>
    <a href="/register" class="btn btn-success ms-2">Додати користувача</a>
  </form>
</div>
</body>
</html>
